name: Update FINN Vega data

on:
  workflow_dispatch:
  push:
    paths:
      - "data/finn_raw.txt"
      - "scripts/scrape_finn.py"
      - ".github/workflows/update_finn.yml"

permissions:
  contents: write

jobs:
  update-finn:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run parser
        run: python scripts/scrape_finn.py

      - name: Commit updated data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/finn_vega.csv data/finn_vega.xlsx
          git commit -m "Update parsed FINN Vega data" || echo "No changes to commit"
          git push
